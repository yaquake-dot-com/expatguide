services:
  postgres:
    image: postgres:16-alpine
    container_name: expatguide-db
    environment:
      POSTGRES_USER: expatguide
      POSTGRES_PASSWORD: expatguide
      POSTGRES_DB: expatguide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
